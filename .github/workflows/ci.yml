name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装工具链（读取 rust-toolchain.toml）
        run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Public icon catalog projections and assets
        run: |
          python3 scripts/generate-icon-web-bindings.py --check
          node --test crates/tekes-ui-icons/web/icons.test.mjs
      - name: Fetch pinned dependencies for offline consumers
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path examples/composition-consumer/Cargo.toml
          cargo fetch --locked --manifest-path examples/brand-consumer/Cargo.toml
          cargo fetch --locked --manifest-path examples/app-host-demo/Cargo.toml
          cargo fetch --locked --manifest-path examples/process-content-consumer/Cargo.toml
      - name: Design package, brand generation and Rust boundaries
        run: |
          python3 -m pip install -r design/imports/v0.3.0-proposal1/upstream/TekesUI-Design-System-v0.3.0-proposal1/requirements.txt
          python3 -m unittest discover -s scripts/tests
          for test in scripts/test-*.py; do python3 "$test"; done
          python3 scripts/generate-gallery-brands.py --check
          python3 scripts/generate-component-capabilities.py --check
          python3 scripts/check-reference-alignment.py --self-test
          python3 scripts/check-reference-alignment.py
          python3 scripts/check-gold7.py
          python3 -I scripts/check-pure-rust.py --self-test
          python3 -I scripts/check-pure-rust.py
          python3 -I scripts/check-design-baseline.py --self-test
          python3 scripts/merge-design-system.py --check
          python3 scripts/check-design-system.py
          cargo run --locked -p tekes-ui-design-export -- --generate design/tokens.json "$RUNNER_TEMP/tokens.rs"
          cargo run --locked -p tekes-ui-design-export -- --check design/tokens.json "$RUNNER_TEMP/tokens.rs"
      - run: cargo fmt --check
      - id: workspace_clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace correctness tests (performance deferred)
        env:
          TEKESUI_FRAGMENT_GPU_OUT: ${{ runner.temp }}/tekesui-fragment-gpu
        run: >-
          cargo test --workspace --locked --no-fail-fast --
          --skip timing_is_off_by_default_and_costs_nothing_to_drain
          --skip cpu_segments_are_consistent_and_frames_are_numbered
          --skip gpu_time_agrees_with_wall_clock_on_a_heavy_frame

      - name: Independent composition consumer (public API)
        if: ${{ !cancelled() && steps.workspace_clippy.outcome == 'success' }}
        run: cargo test --manifest-path examples/composition-consumer/Cargo.toml --locked --no-fail-fast

      - name: Independent Process Content consumer (Issue 48, no native windows)
        if: ${{ !cancelled() && steps.workspace_clippy.outcome == 'success' }}
        run: |
          cargo clippy --manifest-path examples/process-content-consumer/Cargo.toml --all-targets --locked --offline -- -D warnings
          result=0
          cargo run -p tekes-ui-module-runtime --example process_component_services --locked --offline || result=1
          # Default already includes the three mounted-container geometry scenario.
          cargo run --manifest-path examples/process-content-consumer/Cargo.toml --locked --offline || result=1
          for mode in accessibility projection query-wake view-context three-surfaces overlay scroll reading-anchor reading-lifecycle; do
            cargo run --manifest-path examples/process-content-consumer/Cargo.toml --locked --offline -- "--$mode-only" || result=1
          done
          exit "$result"

      - name: Optional bitmap Content and local Image semantics (Issue 117)
        if: ${{ !cancelled() && steps.workspace_clippy.outcome == 'success' }}
        run: |
          cargo clippy -p tekes-ui-controls --features bitmap-images --all-targets --locked -- -D warnings
          cargo test -p tekes-ui-controls --features bitmap-images --lib --test component_registry_api --test bitmap_content_consumer --locked
          cargo clippy -p tekes-ui-platform-macos --features content-accessibility --all-targets --locked -- -D warnings
          cargo test -p tekes-ui-platform-macos --features content-accessibility --lib --locked
          cargo test -p tekes-ui-platform-macos --features content-accessibility --test link_native --locked
          # Issue 127 AC5: compile the actual optional-bitmap proof consumer.
          # GPU cases remain explicit local locked runs; the original Toolbar positive is still open.
          cargo clippy --manifest-path examples/composition-consumer/Cargo.toml --features bitmap-images --test parent_boundary_proof --locked --offline -- -D warnings
          cargo test --manifest-path examples/composition-consumer/Cargo.toml --features bitmap-images --test parent_boundary_proof --no-run --locked --offline

      - name: Independent AppWindow and Settings delivery (Issue 70)
        if: ${{ !cancelled() && steps.workspace_clippy.outcome == 'success' }}
        run: |
          cargo clippy --manifest-path examples/app-host-demo/Cargo.toml --all-targets --all-features --locked --offline -- -D warnings
          cargo test --manifest-path examples/app-host-demo/Cargo.toml --test settings_worker_entry --locked --offline
          for profile in two-panels three-panels mixed-columns independent-settings; do
            cargo build --manifest-path examples/app-host-demo/Cargo.toml --features "$profile" --locked --offline
          done
