# Temporary isolated diagnostic-branch replacement for the existing ci.yml.
# Do not merge this file into main or use it as PR225's required CI.
name: CI197 bounded diagnosis

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact isolated diagnostic commit to execute
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact diagnostic checkout
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Install pinned repository toolchain
        run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile and run the two original cases once
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/ci197-diagnostic
        run: |
          python3 - <<'PY'
          import ctypes, hashlib, json, os, shutil, signal, subprocess, time
          from pathlib import Path
          root = Path.cwd()
          out = Path(os.environ['EVIDENCE_DIR'])
          out.mkdir(exist_ok=False)
          receipt = {'classification': 'temporary failure-side observation, not a repair',
                     'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'runner': {k: os.environ.get(k) for k in ['ImageOS', 'ImageVersion', 'RUNNER_OS', 'RUNNER_ARCH']},
                     'builds': [], 'cases': []}
          def save():
              (out / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          for name, argv in [('os', ['sw_vers']), ('xcode', ['xcodebuild', '-version']),
                             ('rustc', ['rustc', '-vV']), ('cargo', ['cargo', '-vV'])]:
              result = subprocess.run(argv, text=True, capture_output=True, timeout=15)
              (out / (name + '.log')).write_text(result.stdout + result.stderr)
              if result.returncode:
                  raise RuntimeError(f'{name} identity query failed: {result.returncode}')
          receipt['source'] = {p: sha(root / p) for p in [
              'rust-toolchain.toml', 'Cargo.lock',
              'examples/process-content-consumer/Cargo.toml',
              'examples/process-content-consumer/Cargo.lock',
              'examples/process-content-consumer/src/main.rs',
              'examples/process-content-consumer/src/consumer/scroll_consumer.rs',
              '.github/workflows/ci.yml']}
          for relative in receipt['source']:
              destination = out / 'source-inputs' / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(root / relative, destination)
          save()
          commands = [
              ['cargo', 'fetch', '--locked', '--manifest-path', 'examples/process-content-consumer/Cargo.toml'],
              ['cargo', 'clippy', '--manifest-path', 'examples/process-content-consumer/Cargo.toml', '--all-targets', '--locked', '--offline', '--', '-D', 'warnings'],
              ['cargo', 'build', '--manifest-path', 'examples/process-content-consumer/Cargo.toml', '--locked', '--offline', '--message-format=json-render-diagnostics'],
          ]
          build_deadline = time.monotonic() + 1200
          for index, argv in enumerate(commands):
              entry = {'argv': argv}
              receipt['builds'].append(entry)
              save()
              with (out / f'build-{index}.stdout').open('w') as stdout, (out / f'build-{index}.stderr').open('w') as stderr:
                  proc = subprocess.Popen(argv, stdout=stdout, stderr=stderr, start_new_session=True)
                  try:
                      entry['exit_code'] = proc.wait(timeout=max(1, build_deadline - time.monotonic()))
                  except subprocess.TimeoutExpired:
                      entry['timeout'] = True
                      os.killpg(proc.pid, signal.SIGTERM)
                      try:
                          proc.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          os.killpg(proc.pid, signal.SIGKILL)
                          proc.wait(timeout=5)
                      save()
                      raise
              save()
              if entry['exit_code']:
                  raise RuntimeError('compile/fetch failed; both original cases not_run')
          artifacts = []
          for line in (out / 'build-2.stdout').read_text().splitlines():
              if not line.startswith('{'):
                  continue
              record = json.loads(line)
              if (record.get('reason') == 'compiler-artifact'
                  and record.get('target', {}).get('name') == 'tekes-ui-process-content-consumer'
                  and record.get('executable') and record['profile']['test'] is False):
                  artifacts.append(record)
          if len(artifacts) != 1:
              raise RuntimeError('exact non-test compiler executable not established')
          artifact = artifacts[0]
          if Path(artifact['target']['src_path']).resolve() != (root / 'examples/process-content-consumer/src/main.rs').resolve():
              raise RuntimeError('unexpected compiler source')
          program = out / 'actual-process-consumer'
          shutil.copy2(artifact['executable'], program)
          if sha(program) != sha(artifact['executable']):
              raise RuntimeError('archive copy mismatch')
          receipt['program'] = {'path': str(program), 'sha256': sha(program), 'compiler_artifact': artifact}
          save()
          lib = ctypes.CDLL('/usr/lib/libproc.dylib')
          lib.proc_pidpath.argtypes = [ctypes.c_int, ctypes.c_void_p, ctypes.c_uint32]
          lib.proc_pidpath.restype = ctypes.c_int
          def executable(pid):
              buf = ctypes.create_string_buffer(4096)
              return Path(buf.value.decode()) if lib.proc_pidpath(pid, buf, len(buf)) > 0 else None
          def inventory(group):
              raw = subprocess.check_output(['/bin/ps', '-axo', 'pid=,ppid=,pgid=,stat=,comm='], text=True, timeout=10)
              rows = []
              for line in raw.splitlines():
                  p = line.strip().split(None, 4)
                  if len(p) == 5 and int(p[2]) == group:
                      rows.append({'pid': int(p[0]), 'ppid': int(p[1]), 'pgid': int(p[2]), 'stat': p[3], 'comm': p[4]})
              return rows
          allowed = [program, Path('/usr/bin/sample'), Path('/bin/ps'), Path('/bin/kill')]
          def cleanup(group):
              result = []
              for row in inventory(group):
                  pid = row['pid']
                  actual = executable(pid)
                  if actual is None:
                      result.append(dict(row, absent=True))
                      continue
                  if not any(p.exists() and os.path.samefile(actual, p) for p in allowed):
                      raise RuntimeError('unknown executable in owned group; no signal: ' + str(row))
                  for sig, seconds in [(signal.SIGTERM, 3), (signal.SIGKILL, 2)]:
                      current = executable(pid)
                      if current is None:
                          break
                      try:
                          if current != actual or os.getpgid(pid) != group:
                              raise RuntimeError('cleanup identity changed; no signal')
                          os.kill(pid, sig)
                      except ProcessLookupError:
                          break
                      end = time.monotonic() + seconds
                      while executable(pid) is not None and time.monotonic() < end:
                          time.sleep(.05)
                  result.append(dict(row, executable=str(actual), absent=executable(pid) is None))
              return result
          for name, suffix in [('default', []), ('reading-lifecycle', ['--reading-lifecycle-only'])]:
              lane = out / name
              lane.mkdir()
              entry = {'argv': [str(program)] + suffix, 'outer_bound_seconds': 180, 'observed': []}
              receipt['cases'].append(entry)
              env = dict(os.environ)
              env.pop('TEKESUI_PROCESS_CRASH_TRACE', None)
              with (lane / 'stdout.log').open('w') as stdout, (lane / 'stderr.log').open('w') as stderr:
                  proc = subprocess.Popen(entry['argv'], env=env, stdout=stdout, stderr=stderr, start_new_session=True)
                  entry['parent_pid'] = proc.pid
                  entry['started_wall_ns'] = time.time_ns()
                  started = time.monotonic()
                  seen = set()
                  save()
                  try:
                      while proc.poll() is None:
                          for row in inventory(proc.pid):
                              if row['pid'] not in seen:
                                  seen.add(row['pid'])
                                  actual = executable(row['pid'])
                                  entry['observed'].append(dict(row, executable=str(actual) if actual else None))
                          if time.monotonic() - started >= 180:
                              entry['timeout'] = True
                              raise TimeoutError('original case outer bound')
                          time.sleep(.1)
                      entry['exit_code'] = proc.wait(timeout=2)
                  finally:
                      if proc.poll() is None:
                          proc.terminate()
                          try:
                              proc.wait(timeout=5)
                          except subprocess.TimeoutExpired:
                              proc.kill()
                              proc.wait(timeout=5)
                      try:
                          entry['cleanup'] = cleanup(proc.pid)
                      except BaseException as error:
                          entry['cleanup_error'] = str(error)
                          save()
                          raise
                      entry['owned_group_empty'] = not inventory(proc.pid)
                      entry['all_observed_absent'] = all(executable(pid) is None for pid in seen)
                      entry['duration_seconds'] = time.monotonic() - started
                      entry['finished_wall_ns'] = time.time_ns()
                      save()
              if not entry['owned_group_empty'] or not entry['all_observed_absent']:
                  raise RuntimeError('cleanup unproven; next case not_run')
              if sha(program) != receipt['program']['sha256']:
                  raise RuntimeError('program changed; next case not_run')
          receipt['source_unchanged'] = all(sha(root / p) == expected for p, expected in receipt['source'].items())
          save()
          if not receipt['source_unchanged'] or any(c.get('exit_code') != 0 for c in receipt['cases']):
              raise SystemExit(1)
          PY
      - name: Preserve exact source, programme and raw diagnostic results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci197-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci197-diagnostic
          if-no-files-found: error
