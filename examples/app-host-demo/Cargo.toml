[package]
name = "tekes-ui-app-host-demo"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
three-panels = []
two-panels = []
mixed-columns = ["three-panels"]
independent-settings = []

[dependencies]
anyhow = "1"
serde_json = "1"
tekes-ui-app-host = { path = "../../crates/tekes-ui-app-host" }
tekes-ui-settings = { path = "../../crates/tekes-ui-settings" }
tekes-ui-panel-module-demo = { path = "../panel-module-demo" }

[target.'cfg(target_os = "macos")'.dependencies]
tekes-ui-controls = { path = "../../crates/tekes-ui-controls" }
tekes-ui-app-protocol = { path = "../../crates/tekes-ui-app-protocol" }
tekes-ui-render = { path = "../../crates/tekes-ui-render" }
tekes-ui-scene = { path = "../../crates/tekes-ui-scene" }
tekes-ui-tokens = { path = "../../crates/tekes-ui-tokens" }

[workspace]
