[package]
name = "tekes-ui-process-content-consumer"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[target.'cfg(target_os = "macos")'.dependencies]
anyhow = "1"
serde_json = "1"
tekes-ui-controls = { path = "../../crates/tekes-ui-controls" }
tekes-ui-platform-macos = { path = "../../crates/tekes-ui-platform-macos", features = ["content-accessibility"] }
tekes-ui-module-runtime = { path = "../../crates/tekes-ui-module-runtime" }
tekes-ui-app-protocol = { path = "../../crates/tekes-ui-app-protocol" }
tekes-ui-scene = { path = "../../crates/tekes-ui-scene" }
tekes-ui-render = { path = "../../crates/tekes-ui-render" }
tekes-ui-text = { path = "../../crates/tekes-ui-text" }
tekes-ui-tokens = { path = "../../crates/tekes-ui-tokens" }
