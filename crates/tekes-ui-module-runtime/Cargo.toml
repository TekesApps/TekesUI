[package]
name = "tekes-ui-module-runtime"
description = "Experimental native Panel module lifecycle and isolated process renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
serde_json.workspace = true
tekes-ui-app-protocol = { path = "../tekes-ui-app-protocol" }
tekes-ui-scene.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tekes-ui-controls.workspace = true
tekes-ui-platform-macos = { path = "../tekes-ui-platform-macos", features = ["content-accessibility"] }
tekes-ui-render = { path = "../tekes-ui-render", features = ["macos-shared-surface"] }
tekes-ui-tokens.workspace = true
wgpu.workspace = true
mach2 = "0.5"

[target.'cfg(target_os = "macos")'.dependencies.objc2-io-surface]
version = "0.3.2"

[dev-dependencies]
png.workspace = true
serde.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
tekes-ui-text.workspace = true

# Original finite collection verification fixtures; no default feature change.
[features]
svg-icons = ["tekes-ui-controls/svg-icons"]

[[example]]
name = "list_gpu"
path = "examples/list_gpu.rs"
required-features = ["svg-icons"]

[[example]]
name = "tree_gpu"
path = "examples/tree_gpu.rs"
required-features = ["svg-icons"]

[[example]]
name = "table_gpu"
path = "examples/table_gpu.rs"
required-features = ["svg-icons"]
