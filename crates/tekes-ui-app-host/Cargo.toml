[package]
name = "tekes-ui-app-host"
description = "Experimental native TekesUI Host with isolated native Panel processes"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
anyhow = "1"
tekes-ui-settings = { path = "../tekes-ui-settings" }
serde.workspace = true
serde_json.workspace = true
tekes-ui-app-protocol = { git = "https://github.com/TekesApps/TekesUI.git", tag = "controls-number-field-20261022" }
tekes-ui-module-runtime = { git = "https://github.com/TekesApps/TekesUI.git", tag = "controls-number-field-20261022" }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["metal", "wgsl", "std"] }
tekes-ui-render = { git = "https://github.com/TekesApps/TekesUI.git", tag = "controls-number-field-20261022", features = ["macos-shared-surface"] }
tekes-ui-platform-macos = { path = "../tekes-ui-platform-macos" }
tekes-ui-controls = { git = "https://github.com/TekesApps/TekesUI.git", tag = "controls-number-field-20261022" }
tekes-ui-scene = { git = "https://github.com/TekesApps/TekesUI.git", tag = "controls-number-field-20261022" }
tekes-ui-tokens = { git = "https://github.com/TekesApps/TekesUI.git", tag = "controls-number-field-20261022" }
tekes-ui-text = { git = "https://github.com/TekesApps/TekesUI.git", tag = "controls-number-field-20261022" }
tekes-ui-motion = { git = "https://github.com/TekesApps/TekesUI.git", tag = "controls-number-field-20261022" }
resvg = { version = "0.48.0", default-features = false }
tekes-ui-icons = { git = "https://github.com/TekesApps/TekesUI.git", tag = "controls-number-field-20261022" }
