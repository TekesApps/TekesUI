[package]
name = "tekes-ui-app-host"
description = "Experimental native TekesUI Host with isolated native Panel processes"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
tekes-ui-app-protocol = { path = "../tekes-ui-app-protocol" }
tekes-ui-module-runtime = { path = "../tekes-ui-module-runtime" }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["metal", "wgsl", "std"] }
tekes-ui-render = { path = "../tekes-ui-render", features = ["macos-shared-surface"] }
tekes-ui-platform-macos = { path = "../tekes-ui-platform-macos", features = ["content-accessibility"] }
tekes-ui-controls = { path = "../tekes-ui-controls" }
tekes-ui-scene = { path = "../tekes-ui-scene" }
tekes-ui-tokens = { path = "../tekes-ui-tokens" }
tekes-ui-text = { path = "../tekes-ui-text" }
tekes-ui-motion = { path = "../tekes-ui-motion" }
resvg = { version = "0.48.0", default-features = false }
tekes-ui-icons = { path = "../tekes-ui-icons" }
