[package]
name = "tekes-ui-app-host"
description = "Experimental native TekesUI Host with isolated native Panel processes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
window-acceptance = ["tekes-ui-platform-macos/selftest", "tekes-ui-macos-bridge/selftest"]

[dependencies]
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
tekes-ui-app-protocol.workspace = true
tekes-ui-module-runtime.workspace = true
tekes-ui-settings.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
wgpu.workspace = true
tekes-ui-render = { workspace = true, features = ["macos-shared-surface"] }
tekes-ui-platform-macos.workspace = true
tekes-ui-macos-bridge.workspace = true
tekes-ui-controls = { workspace = true, features = ["svg-icons"] }
tekes-ui-scene.workspace = true
tekes-ui-tokens.workspace = true
tekes-ui-text.workspace = true
tekes-ui-motion.workspace = true
resvg = { version = "0.48.0", default-features = false }
tekes-ui-icons.workspace = true

[lints]
workspace = true

[[test]]
name = "macos_lifecycle_native"
harness = false
required-features = ["window-acceptance"]
