[package]
name = "tekes-ui-text"
description = "TekesUI 文字：排版、字体回退、光栅化三个 trait，CoreText 实现，布局导出与像素对比"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
qa = ["dep:serde", "dep:serde_json"]

[dependencies]
tekes-ui-tokens.workspace = true
tekes-ui-scene.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
unicode-segmentation = "1.13.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["CFString", "CFAttributedString", "CFDictionary", "CFNumber", "CFArray", "CFCGTypes", "CFBase", "CFCharacterSet", "CFData"] }
objc2-core-graphics = { workspace = true, features = ["CGColor", "CGColorSpace", "CGBitmapContext", "CGContext", "CGAffineTransform", "CGGeometry", "CGImage", "CGPath"] }
objc2-core-text = { workspace = true, features = ["CTFont", "CTFontDescriptor", "CTLine", "CTRun", "CTTypesetter", "CTStringAttributes", "CTFontTraits", "CTFrame", "CTFramesetter", "objc2-core-graphics"] }

[dev-dependencies]
tekes-ui-render.workspace = true
png.workspace = true

[[test]]
name = "export"
path = "tests/export.rs"
required-features = ["qa"]

[[test]]
name = "e2e_oracle"
path = "tests/e2e_oracle.rs"
required-features = ["qa"]

[[test]]
name = "shape"
path = "tests/shape.rs"
required-features = ["qa"]

[[test]]
name = "label_native_probe"
path = "tests/label_native_probe.rs"
required-features = ["qa"]

[[test]]
name = "label_layout_gpu"
path = "tests/label_layout_gpu.rs"
required-features = ["qa"]

[lints]
workspace = true
