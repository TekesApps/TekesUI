[package]
name = "tekes-ui-gallery"
description = "TekesUI Gallery 应用"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
composition-review = ["dep:tekes-ui-composition-consumer"]

[target.'cfg(target_os = "macos")'.dependencies]
tekes-ui-controls.workspace = true
tekes-ui-scene3d = { path = "../tekes-ui-scene3d" }
tekes-ui-composition-consumer = { path = "../../examples/composition-consumer", optional = true }
tekes-ui-icons = { path = "../tekes-ui-icons" }
tekes-ui-motion = {path="../tekes-ui-motion"}
tekes-ui-tokens.workspace = true
tekes-ui-scene.workspace = true
tekes-ui-platform-macos.workspace = true
tekes-ui-render.workspace = true
tekes-ui-text.workspace = true
png.workspace = true
serde_json.workspace = true
unicode-segmentation = "1"
resvg = { version = "0.48.0", default-features = false }

[lints]
workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
tekes-ui-composition-consumer = { path = "../../examples/composition-consumer" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { workspace = true, features = ["NSUserDefaults", "NSString", "NSArray"] }
