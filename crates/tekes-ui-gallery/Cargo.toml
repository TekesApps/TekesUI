[package]
name = "tekes-ui-gallery"
description = "TekesUI Gallery 应用"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
selftest = ["tekes-ui-platform-macos/selftest", "tekes-ui-macos-bridge/selftest"]

[target.'cfg(target_os = "macos")'.dependencies]
tekes-ui-module-runtime = { path = "../tekes-ui-module-runtime" }
anyhow = "1"
tekes-ui-app-host = { path = "../tekes-ui-app-host" }
tekes-ui-app-protocol = { path = "../tekes-ui-app-protocol" }
tekes-ui-controls = { workspace = true, features = ["inspection"] }
tekes-ui-scene3d = { path = "../tekes-ui-scene3d" }
tekes-ui-icons = { path = "../tekes-ui-icons" }
tekes-ui-motion = {path="../tekes-ui-motion"}
tekes-ui-tokens.workspace = true
tekes-ui-scene.workspace = true
tekes-ui-platform-macos = { workspace = true }
tekes-ui-macos-bridge = { workspace = true }
tekes-ui-render.workspace = true
tekes-ui-text = { path = "../tekes-ui-text", features = ["qa"] }
png.workspace = true
serde_json.workspace = true
unicode-segmentation = "1"
resvg = { version = "0.48.0", default-features = false }

[lints]
workspace = true

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true
tekes-ui-design-export = { path = "../tekes-ui-design-export" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { workspace = true, features = ["NSUserDefaults", "NSString", "NSArray"] }

[[example]]
name = "metal_reentrant_resize"
required-features = ["selftest"]

[[example]]
name = "settings_native207"
required-features = ["selftest"]
