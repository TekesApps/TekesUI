[package]
name = "tekes-ui-gallery"
description = "TekesUI Gallery 应用"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
selftest = ["tekes-ui-platform-macos/selftest", "tekes-ui-macos-bridge/selftest"]

[target.'cfg(target_os = "macos")'.dependencies]
tekes-ui-module-runtime.workspace = true
anyhow = "1"
tekes-ui-app-host.workspace = true
tekes-ui-app-protocol.workspace = true
tekes-ui-controls = { workspace = true, features = ["inspection", "syntax-highlighting"] }
tekes-ui-scene3d.workspace = true
tekes-ui-icons.workspace = true
tekes-ui-motion.workspace = true
tekes-ui-tokens.workspace = true
tekes-ui-scene.workspace = true
tekes-ui-platform-macos.workspace = true
tekes-ui-macos-bridge.workspace = true
tekes-ui-render.workspace = true
tekes-ui-text = { workspace = true, features = ["qa"] }
png.workspace = true
serde_json.workspace = true
unicode-segmentation = "1"
resvg = { version = "0.48.0", default-features = false }

[lints]
workspace = true

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true
tekes-ui-design-export.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { workspace = true, features = ["NSUserDefaults", "NSString", "NSArray"] }

[[example]]
name = "metal_reentrant_resize"
required-features = ["selftest"]

[[example]]
name = "settings_native207"
required-features = ["selftest"]
