[package]
name = "tekes-ui-render"
description = "TekesUI 渲染层，基于 wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tekes-ui-tokens.workspace = true
tekes-ui-scene.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
pollster.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# 版本与根 Cargo.toml 里平台层用的一致；待 workspace.dependencies 稳定后可改为 workspace = true。
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColorSpace"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer"] }

[dev-dependencies]
png.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }

[lints]
workspace = true
