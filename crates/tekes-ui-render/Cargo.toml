[package]
name = "tekes-ui-render"
description = "TekesUI 渲染层，基于 wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tekes-ui-tokens.workspace = true
tekes-ui-scene.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
pollster.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { workspace = true, features = ["CGColorSpace"] }
objc2-quartz-core = { workspace = true, features = ["CALayer", "CAMetalLayer"] }

[dev-dependencies]
png.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2.workspace = true
objc2-core-foundation = { workspace = true, features = ["CFCGTypes", "CFString"] }

[lints]
workspace = true
