[package]
name = "tekes-ui-render"
description = "TekesUI 渲染层，基于 wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
macos-shared-surface = ["dep:anyhow", "dep:wgpu-hal", "dep:objc2", "dep:objc2-metal", "dep:objc2-io-surface", "dep:objc2-core-foundation"]

[dependencies]
tekes-ui-tokens.workspace = true
tekes-ui-scene.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
pollster.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
anyhow = { version = "1", optional = true }
wgpu-hal = { version = "30.0.1", features = ["metal"], optional = true }
objc2 = { workspace = true, optional = true }
objc2-metal = { version = "0.3.2", features = ["MTLTexture", "MTLDevice", "objc2-io-surface"], optional = true }
objc2-io-surface = { version = "0.3.2", optional = true }
objc2-core-foundation = { workspace = true, features = ["CFDictionary", "CFNumber"], optional = true }

objc2-core-graphics = { workspace = true, features = ["CGColorSpace"] }
objc2-quartz-core = { workspace = true, features = ["CALayer", "CAMetalLayer"] }

[dev-dependencies]
png.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2.workspace = true
objc2-core-foundation = { workspace = true, features = ["CFCGTypes", "CFString"] }

[lints]
workspace = true
