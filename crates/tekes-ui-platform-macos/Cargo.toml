[package]
name = "tekes-ui-platform-macos"
description = "TekesUI macOS 平台层，基于 objc2 AppKit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSObject", "NSString", "NSGeometry", "NSNotification", "NSProcessInfo", "NSArray", "NSEnumerator", "NSThread", "NSRunLoop", "NSRange"] }
objc2-app-kit = { workspace = true, features = [
    "NSApplication", "NSResponder", "NSView", "NSWindow", "NSEvent", "NSMenu", "NSMenuItem",
    "NSTrackingArea", "NSWorkspace", "NSAppearance", "NSScreen", "NSAccessibility", "NSControl",
    "NSGraphics", "NSRunningApplication", "NSCell", "NSGraphicsContext", "objc2-quartz-core", "objc2-core-foundation",
] }
objc2-quartz-core = { workspace = true, features = ["CALayer", "CAMetalLayer", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["CGColorSpace"] }

# 示例 window.rs 的自测模式需要额外的特性（合成输入事件、改层背景色）。
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { workspace = true, features = ["NSValue"] }
objc2-app-kit = { workspace = true, features = ["objc2-core-graphics"] }
objc2-quartz-core = { workspace = true, features = ["CATransaction"] }
objc2-core-graphics = { workspace = true, features = ["CGColor", "CGEvent", "CGEventTypes", "CGEventSource"] }
