[package]
name = "tekes-ui-platform-macos"
description = "TekesUI macOS 平台层，基于 objc2 AppKit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSObject", "NSString", "NSGeometry", "NSNotification", "NSProcessInfo", "NSArray", "NSEnumerator", "NSThread", "NSRunLoop", "NSDictionary", "NSValue", "NSRange", "NSAttributedString"] }
objc2-app-kit = { workspace = true, features = [
    "NSAttributedString", "NSTextInputClient", "NSTextInputContext", "NSPasteboard", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSEvent", "NSMenu", "NSMenuItem",
    "NSTrackingArea", "NSWorkspace", "NSAppearance", "NSScreen", "NSAccessibility", "NSControl",
    "NSGraphics", "NSRunningApplication", "NSCell", "NSGraphicsContext", "objc2-quartz-core", "objc2-core-foundation",
] }
objc2-quartz-core = { workspace = true, features = ["CALayer", "CAMetalLayer", "CADisplayLink", "CAMetalDisplayLink", "CAFrameRateRange", "CABase", "objc2-core-foundation", "objc2-core-graphics", "objc2-metal"] }
block2 = "0.6.2"
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDrawable", "block2", "objc2-core-foundation"] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["CGColorSpace", "CGDisplayConfiguration", "CGDirectDisplay", "libc"] }

# 示例 window.rs 的自测模式需要额外的特性（合成输入事件、改层背景色）。
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { workspace = true, features = ["NSValue"] }
objc2-app-kit = { workspace = true, features = ["objc2-core-graphics", "NSScrollView", "NSClipView", "NSScroller", "NSColor", "NSBezierPath", "NSStringDrawing", "NSTextView", "NSText", "NSFont", "NSFontDescriptor", "NSParagraphStyle"] }
objc2-quartz-core = { workspace = true, features = ["CATransaction"] }
objc2-core-graphics = { workspace = true, features = ["CGColor", "CGEvent", "CGEventTypes", "CGEventSource", "CGBitmapContext", "CGContext", "CGImage"] }

# Native oracle is an example-only measurement tool, never a Gallery control.
[dev-dependencies]
tekes-ui-controls = { path = "../tekes-ui-controls" }
tekes-ui-scene.workspace = true
serde_json.workspace = true
