[workspace]
resolver = "3"
members = [
    "crates/*",
    "examples/app-host-demo",
    "examples/brand-consumer",
    "examples/composition-consumer",
    "examples/host-reveal-consumer",
    "examples/icon-catalog-consumer",
    "examples/media-viewer-content-consumer",
    "examples/panel-content-consumer",
    "examples/panel-module-demo",
    "examples/process-content-consumer",
    "examples/theme-system-consumer",
    "examples/city-3d-demo/crates/*",
]
default-members = ["crates/*"]

[workspace.package]
# 版本号的唯一权威来源；各 crate 使用 version.workspace = true。
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/TekesApps/TekesUI"
rust-version = "1.95"

[workspace.dependencies]
tekes-ui-controls = { version = "0.4.0", path = "crates/tekes-ui-controls" }
tekes-ui-tokens = { version = "0.4.0", path = "crates/tekes-ui-tokens" }
tekes-ui-design-export = { version = "0.4.0", path = "crates/tekes-ui-design-export" }
tekes-ui-scene = { version = "0.4.0", path = "crates/tekes-ui-scene" }
tekes-ui-render = { version = "0.4.0", path = "crates/tekes-ui-render" }
tekes-ui-text = { version = "0.4.0", path = "crates/tekes-ui-text" }
tekes-ui-motion = { version = "0.4.0", path = "crates/tekes-ui-motion" }
tekes-ui-icons = { version = "0.4.0", path = "crates/tekes-ui-icons" }
tekes-ui-scene3d = { version = "0.4.0", path = "crates/tekes-ui-scene3d" }
tekes-ui-platform-macos = { version = "0.4.0", path = "crates/tekes-ui-platform-macos" }
tekes-ui-macos-bridge = { version = "0.4.0", path = "crates/tekes-ui-macos-bridge" }
tekes-ui-app-protocol = { version = "0.4.0", path = "crates/tekes-ui-app-protocol" }
tekes-ui-module-runtime = { version = "0.4.0", path = "crates/tekes-ui-module-runtime" }
tekes-ui-settings = { version = "0.4.0", path = "crates/tekes-ui-settings" }
tekes-ui-app-host = { version = "0.4.0", path = "crates/tekes-ui-app-host" }
tekes-ui-compare = { path = "crates/tekes-ui-compare" }
wgpu = { version = "30.0.1", default-features = false, features = ["metal", "wgsl", "std"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
png = "0.17"
sha2 = "0.11"
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
