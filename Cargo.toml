[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# 版本号的唯一权威来源；各 crate 使用 version.workspace = true。
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/TekesApps/TekesUI"
rust-version = "1.95"

[workspace.dependencies]
tekes-ui-tokens = { path = "crates/tekes-ui-tokens" }
tekes-ui-scene = { path = "crates/tekes-ui-scene" }
tekes-ui-render = { path = "crates/tekes-ui-render" }
wgpu = { version = "30.0.1", default-features = false, features = ["metal", "wgsl", "std"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
png = "0.17"
tekes-ui-platform-macos = { path = "crates/tekes-ui-platform-macos" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
