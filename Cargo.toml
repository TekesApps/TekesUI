[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# 版本号的唯一权威来源；各 crate 使用 version.workspace = true。
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/TekesApps/TekesUI"
rust-version = "1.95"

[workspace.dependencies]
tekes-ui-tokens = { path = "crates/tekes-ui-tokens" }
tekes-ui-scene = { path = "crates/tekes-ui-scene" }
tekes-ui-render = { path = "crates/tekes-ui-render" }
tekes-ui-text = { path = "crates/tekes-ui-text" }
tekes-ui-compare = { path = "crates/tekes-ui-compare" }
wgpu = { version = "30.0.1", default-features = false, features = ["metal", "wgsl", "std"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
png = "0.17"
sha2 = "0.11"
tekes-ui-platform-macos = { path = "crates/tekes-ui-platform-macos" }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
